[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypasteserver"
version = "0.0.0"
description = "Clipboard server"
authors = [{name = "Ben Hoff", email = "hoff.benjamin.k@gmail.com"}]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi[standard]",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "sqlalchemy",
    "gunicorn",
    "redis>=4.0.0",
]

[tool.setuptools]
packages = ["server_app"]

[tool.setuptools.package-dir]
server_app = "server_app"
