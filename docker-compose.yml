services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYP_SERVER_VERSION: "${PYP_SERVER_VERSION:-0.0.0}"
    container_name: fastapi_app
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        alembic upgrade head && exec gunicorn server_app.main:app
        --worker-class server_app.worker.SyncUvicornWorker
        --bind 0.0.0.0:8001 --workers 4
    volumes:
      - "${PYP_SERVER_DATA_DIRECTORY:-.}:/data"
    ports:
      - "${PYP_SERVER_BIND_ADDRESS:-0.0.0.0}:${PYP_SERVER_PORT:-8001}:8001"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=sqlite:////data/clipboard.db
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - REDIS_URL=redis://redis:6379
      - RUN_DATABASE_MIGRATIONS_ON_STARTUP=0
      - SYNC_REQUIRE_TLS=${SYNC_REQUIRE_TLS:-0}
      - SYNC_ALLOW_LEGACY_BEARER=${SYNC_ALLOW_LEGACY_BEARER:-0}
      - SYNC_RETENTION_MAX_AGE_SECONDS=${SYNC_RETENTION_MAX_AGE_SECONDS:-604800}
      - SYNC_RETENTION_MAX_EVENTS=${SYNC_RETENTION_MAX_EVENTS:-1000}
      - SYNC_RETENTION_MAX_STORAGE_BYTES=${SYNC_RETENTION_MAX_STORAGE_BYTES:-134217728}
      - SYNC_RETENTION_CLEANUP_INTERVAL_SECONDS=${SYNC_RETENTION_CLEANUP_INTERVAL_SECONDS:-3600}
    depends_on:
      - redis
    networks:
      - app_network

  redis:
    image: "redis:7"
    container_name: redis
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
