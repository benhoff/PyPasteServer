version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_app
    command: >-
      gunicorn server_app.main:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8001 --workers 4
    volumes:
      - ./clipboard.db:/app/clipboard.db
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=sqlite:////app/clipboard.db
      - JWT_SECRET=supersecretkey
      - JWT_ALGORITHM=HS256
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - app_network

  redis:
    image: "redis:7"
    container_name: redis
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
