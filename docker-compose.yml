services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_app
    command:
      - sh
      - -c
      - >-
        alembic upgrade head && exec gunicorn server_app.main:app
        --worker-class server_app.worker.SyncUvicornWorker
        --bind 0.0.0.0:8001 --workers 4
    volumes:
      - ./:/data
    ports:
      - "8001:8001"
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite:////data/clipboard.db
      - JWT_SECRET=supersecretkey
      - JWT_ALGORITHM=HS256
      - REDIS_URL=redis://redis:6379
      - RUN_DATABASE_MIGRATIONS_ON_STARTUP=0
    depends_on:
      - redis
    networks:
      - app_network

  redis:
    image: "redis:7"
    container_name: redis
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
